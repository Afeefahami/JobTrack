<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobTrack — Your Career, Organized.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="JobTrack helps you track job applications, interviews, deadlines and reminders in one place."
    />
    <meta name="theme-color" content="#0B7A75" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before the app loads to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('jobtrack_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
